name: Commit calendar

on:
  schedule:
    - cron: '17 5,17 * * *'   # twice a day, off the hour so it is not queued with everyone else
  workflow_dispatch:          # or run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: commit-calendar
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Counted here rather than in the browser: this token allows five
      # thousand calls an hour, the visitor's address allows sixty.
      - name: Count commits for the calendar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build_calendar.py

      - name: Commit, but only if something actually moved
        run: |
          if [ -z "$(git status --porcelain data/commits.json)" ]; then
            echo "nothing changed"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/commits.json
          git commit -m "Refresh the commit calendar

          Written by .github/workflows/commit-calendar.yml."
          git push
